services:
  app:
    build: .
    depends_on:
      - db
    environment:
       DATABASE_URL: ${DATABASE_LOCAL_URL}
       INT_PORT: ${INT_PORT}
       EXT_PORT: ${EXT_PORT}
    ports:
      - ${EXT_PORT}:${INT_PORT}

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: craft-site
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
  
volumes:
  pgdata:
